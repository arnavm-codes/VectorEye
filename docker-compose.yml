services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  vectoreye:
    build: .
    ports:
      - "9100:9100"
    env_file: .env
    environment:
      QDRANT_HOST: qdrant
      # Floci runs separately on the host (port 4566); reach it from the container:
      S3_ENDPOINT: http://host.docker.internal:4566
      # Clip URLs point at this API, so they must be reachable from the caller's browser:
      API_PUBLIC_URL: http://localhost:9100
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant

volumes:
  qdrant_storage:
